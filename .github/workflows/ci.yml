name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    uses: cloud-in-a-bottle/app-template/.github/workflows/app-test.yml@main

  image:
    needs: test
    if: github.event_name == 'push'
    uses: cloud-in-a-bottle/app-template/.github/workflows/app-image.yml@main
    permissions:
      contents: read
      id-token: write

  release:
    needs: image
    uses: cloud-in-a-bottle/app-template/.github/workflows/app-release.yml@main
    permissions:
      contents: write
