[app]
name = "md-notes"
version = "0.1.0"
description = "Obsidian-like markdown notes app with live preview and Yjs sync"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"
# All routes are public — the app handles its own auth via API key.
# OpenHost router owner sessions are also accepted (X-OpenHost-Is-Owner).
public_paths = ["/"]

# Read-only notes access for other apps in the space. Spec + grant shape: services/notes/.
[[services.v2.provides]]
service = "github.com/imbue-openhost/md-notes/services/notes"
version = "0.1.0"
endpoint = "/api/service/notes/"

[resources]
memory_mb = 1024
# more cores = faster search
cpu_cores = 4

[data]
sqlite = ["main"]
app_data = true
